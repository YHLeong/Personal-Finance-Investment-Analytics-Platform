services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: fin, POSTGRES_PASSWORD: fin, POSTGRES_DB: fin}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fin"], interval: 3s, retries: 10}
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://fin:fin@db:5432/fin
      SECRET_KEY: change-me
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  ui:
    build: .
    command: streamlit run ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment: {API_URL: "http://api:8000"}
    ports: ["8501:8501"]
    depends_on: [api]
volumes: {pgdata: {}}
